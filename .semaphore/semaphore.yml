version: v1.0
name: "\U0001F680 Laravel CI/CD Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'ubuntu:22.04'
fail_fast:
  stop:
    when: 'true'
auto_cancel:
  running:
    when: 'true'
  queued:
    when: 'true'
global_job_config:
  prologue:
    commands:
      - export DEBIAN_FRONTEND=noninteractive
      - apt-get update
      - apt-get install -y \ software-properties-common \ ca-certificates \ apt-transport-https \ wget \ curl \ git \ unzip
      - 'add-apt-repository ppa:ondrej/php'
      - apt-get update
      - apt-get install -y \ php8.3 \ php8.3-cli \ php8.3-common \ php8.3-curl \ php8.3-mbstring \ php8.3-xml \ php8.3-zip \ php8.3-gd \ php8.3-mysql \ php8.3-pgsql \ php8.3-sqlite3 \ php8.3-opcache
      - 'curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer'
      - 'curl -fsSL https://deb.nodesource.com/setup_20.x | bash -'
      - apt-get install -y nodejs
      - 'wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -'
      - 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
      - apt-get update
      - apt-get install -y google-chrome-stable
      - checkout
      - composer install --no-interaction --prefer-dist --optimize-autoloader
      - npm ci --prefer-offline --no-audit
      - cp .env.example .env
      - 'php artisan key:generate'
      - 'php artisan config:clear'
blocks:
  - name: "\U0001F6E0 Dependency Management"
    dependencies: []
    task:
      jobs:
        - name: Install and Cache Dependencies
          commands:
            - composer validate
            - npm audit signatures
            - cache store composer-deps vendor
            - cache store npm-deps node_modules
  - name: "\U0001F3A8 Frontend Build"
    dependencies:
      - "\U0001F6E0 Dependency Management"
    task:
      jobs:
        - name: Compile Frontend Assets
          commands:
            - npm run lint
            - npm run build
            - cache store frontend-assets public/build
  - name: "\U0001F50D Code Quality"
    dependencies:
      - "\U0001F6E0 Dependency Management"
    task:
      jobs:
        - name: Static Analysis and Coding Standards
          commands:
            - ./vendor/bin/pint --test
            - ./vendor/bin/phpstan analyse --memory-limit=2G
            - ./vendor/bin/phpcs --standard=PSR2 app
            - npm run stylelint
  - name: "\U0001F510 Security Scanning"
    dependencies:
      - "\U0001F6E0 Dependency Management"
    task:
      jobs:
        - name: Dependency and Code Security
          commands:
            - composer audit --no-dev
            - npm audit --audit-level=high
            - php /usr/local/bin/composer global require enlightn/security-checker
            - 'security-checker security:check ./composer.lock'
  - name: "\U0001F9EA Backend Testing"
    dependencies:
      - "\U0001F50D Code Quality"
      - "\U0001F510 Security Scanning"
    task:
      env_vars:
        - name: APP_ENV
          value: testing
      jobs:
        - name: PHPUnit Tests
          parallelism: 4
          commands:
            - php artisan test --parallel --coverage --min=80
      epilogue:
        on_pass:
          commands:
            - test-results publish
        on_fail:
          commands:
            - test-results publish
            - artifacts save report.xml test-reports/
  - name: "\U0001F310 Browser Testing"
    dependencies:
      - "\U0001F9EA Backend Testing"
    task:
      jobs:
        - name: Laravel Dusk Browser Tests
          commands:
            - 'php artisan dusk:chrome-driver install'
            - php artisan serve --port=8000 &
            - sleep 5
            - php artisan dusk
after_pipeline:
  task:
    jobs:
      - name: "Generate Test Report \U0001F4CA"
        commands:
          - test-results gen-pipeline-report
