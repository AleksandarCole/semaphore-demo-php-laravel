# Streamlined CI/CD Pipeline Configuration

version: v1.0
name: "🚀 Laravel CI/CD Pipeline"

# Use more specific machine type and OS image placeholders
agent:
  machine:
    type: e1-standard-4  # Recommended machine type for Laravel projects
    os_image: ubuntu-2204  # Stable Ubuntu LTS version

  # Use a more comprehensive base image
  containers:
    - name: main
      image: 'php:8.3-cli-bullseye'  # Debian-based PHP 8.3 CLI image

# Improved fail-fast and auto-cancel configurations
fail_fast:
  stop:
    when: "true"  # Stop pipeline on any job failure
auto_cancel:
  running:
    when: "true"  # Cancel running pipelines on new commits
  queued:
    when: "true"  # Cancel older queued pipelines

# Global job configuration with more comprehensive setup
global_job_config:
  prologue:
    commands:
      # Install system and build dependencies
      - apt-get update
      - apt-get install -y git unzip curl wget gnupg2 libzip-dev libpng-dev libonig-dev

      # Install PHP extensions
      - docker-php-ext-install pdo pdo_mysql mbstring zip gd opcache

      # Install Composer
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      # Install Node.js and npm using NodeSource
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs

      # Checkout and prepare project
      - checkout
      
      # Dependency installation
      - composer install --no-interaction --prefer-dist --optimize-autoloader
      - npm ci --prefer-offline --no-audit
      
      # Laravel-specific setup
      - cp .env.example .env
      - php artisan key:generate
      - php artisan config:clear

# Comprehensive pipeline blocks with improved error handling
blocks:
  - name: "🛠 Dependency Management"
    dependencies: []
    task:
      jobs:
        - name: Install and Cache Dependencies
          commands:
            - composer validate
            - npm audit signatures
            - cache store composer-deps vendor
            - cache store npm-deps node_modules

  - name: "🎨 Frontend Build"
    dependencies: ["🛠 Dependency Management"]
    task:
      jobs:
        - name: Compile Frontend Assets
          commands:
            - npm run lint
            - npm run build
            - cache store frontend-assets public/build

  - name: "🔍 Code Quality"
    dependencies: ["🛠 Dependency Management"]
    task:
      jobs:
        - name: Static Analysis and Coding Standards
          commands:
            - ./vendor/bin/pint --test
            - ./vendor/bin/phpstan analyse --memory-limit=2G
            - ./vendor/bin/phpcs --standard=PSR2 app
            - npm run stylelint

  - name: "🔐 Security Scanning"
    dependencies: ["🛠 Dependency Management"]
    task:
      jobs:
        - name: Dependency and Code Security
          commands:
            - composer audit --no-dev
            - npm audit --audit-level=high
            - php /usr/local/bin/composer global require enlightn/security-checker
            - security-checker security:check ./composer.lock

  - name: "🧪 Backend Testing"
    dependencies: ["🔍 Code Quality", "🔐 Security Scanning"]
    task:
      env_vars:
        - name: APP_ENV
          value: testing
      jobs:
        - name: "PHPUnit Tests"
          parallelism: 4
          commands:
            - php artisan test --parallel --coverage --min=80

      epilogue:
        on_pass:
          commands:
            - test-results publish
        on_fail:
          commands:
            - test-results publish
            - artifacts save report.xml test-reports/

  - name: "🌐 Browser Testing"
    dependencies: ["🧪 Backend Testing"]
    task:
      jobs:
        - name: Laravel Dusk Browser Tests
          commands:
            # Install Chrome and ChromeDriver
            - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
            - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list
            - apt-get update
            - apt-get install -y google-chrome-stable
            - php artisan dusk:chrome-driver install
            - php artisan serve --port=8000 &
            - sleep 5
            - php artisan dusk

# Post-pipeline reporting
after_pipeline:
  task:
    jobs:
      - name: "Generate Test Report 📊"
        commands:
          - test-results gen-pipeline-report